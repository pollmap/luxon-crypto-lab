<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="80%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#magentaGlow)"/>
  <rect width="1200" height="4" fill="url(#topBar)"/>

  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#9090a8" font-size="22" letter-spacing="3">
    <text x="80" y="100">▌ LUXON-CRYPTO-LAB</text>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" filter="url(#textGlow)">
    <text x="80" y="240" fill="#00ffff" font-size="92" letter-spacing="-2">Top 10</text>
    <text x="320" y="240" fill="#f0f0f5" font-size="92" letter-spacing="-2">cryptocurrency</text>
    <text x="80" y="350" fill="#f0f0f5" font-size="92" letter-spacing="-2">monthly</text>
    <text x="430" y="350" fill="#ff00ff" font-size="92" letter-spacing="-2">deep dive</text>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#a0a0b8" font-size="26">
    <text x="80" y="430">매크로 사이클 × 온체인 메트릭 × 모멘텀</text>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#707088" font-size="18" letter-spacing="2">
    <text x="80" y="555">12 MONTHS · 12 POSTS · 12 ASSETS</text>
    <text x="80" y="585">BTC · ETH · SOL · BNB · XRP · TRX · USDT · DOGE · FIGR · ...</text>
  </g>

  <g transform="translate(1050, 500)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.6"/>
    <text x="0" y="8" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#00ffff" font-weight="700">⌬</text>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#5a5a72" font-size="14" letter-spacing="1">
    <text x="1200" y="615" text-anchor="end" dx="-80">pollmap.github.io/luxon-crypto-lab</text>
  </g>
</svg>
