name: Lighthouse CI

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Wait for Pages propagation
        run: sleep 30

      - name: Audit URLs with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://pollmap.github.io/luxon-crypto-lab/
            https://pollmap.github.io/luxon-crypto-lab/posts/
            https://pollmap.github.io/luxon-crypto-lab/roadmap/
            https://pollmap.github.io/luxon-crypto-lab/about/
            https://pollmap.github.io/luxon-crypto-lab/coins/btc/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse/config.json
